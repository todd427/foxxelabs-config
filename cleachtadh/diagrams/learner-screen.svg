<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <rect width="900" height="560" fill="#fff"/>
  <text x="450" y="28" text-anchor="middle" font-size="20" font-weight="bold" fill="#1F6FB2">Cleachtadh — learner consultation screen</text>

  <!-- window frame -->
  <rect x="30" y="50" width="840" height="480" rx="10" fill="#FAFAFA" stroke="#999" stroke-width="2"/>
  <!-- top bar -->
  <rect x="30" y="50" width="840" height="40" rx="10" fill="#1F6FB2"/>
  <rect x="30" y="75" width="840" height="15" fill="#1F6FB2"/>
  <text x="50" y="76" fill="#fff" font-weight="bold">Cleachtadh</text>
  <text x="300" y="76" fill="#fff">Case: Margaret Doyle, 61 · GP surgery · 10 min</text>
  <text x="690" y="76" fill="#fff">Turn 14 · 06:42</text>
  <rect x="800" y="58" width="60" height="24" rx="4" fill="#fff"/>
  <text x="830" y="75" text-anchor="middle" fill="#1F6FB2" font-size="12">End</text>

  <!-- transcript pane -->
  <rect x="45" y="105" width="540" height="340" fill="#fff" stroke="#ccc"/>
  <text x="60" y="125" fill="#777" font-size="11">CONSULTATION</text>

  <rect x="60" y="138" width="380" height="36" rx="6" fill="#E8F1FA"/>
  <text x="72" y="153" font-weight="bold" fill="#1F6FB2">You</text>
  <text x="72" y="168">What brings you in today?</text>

  <rect x="200" y="184" width="370" height="50" rx="6" fill="#EAF6EA"/>
  <text x="212" y="199" font-weight="bold" fill="#2E8B57">Margaret</text>
  <text x="212" y="214">I've been getting a tightness. On the stairs mostly.</text>
  <text x="212" y="228">It's probably nothing.</text>

  <rect x="60" y="244" width="380" height="36" rx="6" fill="#E8F1FA"/>
  <text x="72" y="259" font-weight="bold" fill="#1F6FB2">You</text>
  <text x="72" y="274">Is it a sharp pain?</text>

  <rect x="200" y="290" width="370" height="36" rx="6" fill="#EAF6EA"/>
  <text x="212" y="305" font-weight="bold" fill="#2E8B57">Margaret</text>
  <text x="212" y="320">No. More like a weight.</text>

  <rect x="60" y="336" width="380" height="36" rx="6" fill="#E8F1FA"/>
  <text x="72" y="351" font-weight="bold" fill="#1F6FB2">You</text>
  <text x="72" y="366">Does it go away when you stop?</text>

  <!-- input -->
  <rect x="45" y="455" width="460" height="40" rx="6" fill="#fff" stroke="#999"/>
  <text x="60" y="480" fill="#aaa">Type your next question…</text>
  <rect x="515" y="455" width="70" height="40" rx="6" fill="#1F6FB2"/>
  <text x="550" y="480" text-anchor="middle" fill="#fff">Send</text>

  <!-- mentor pane -->
  <rect x="600" y="105" width="255" height="390" fill="#F8F3FC" stroke="#7B3FA0"/>
  <text x="615" y="125" fill="#7B3FA0" font-size="11" font-weight="bold">MEANTÓIR</text>
  <rect x="770" y="112" width="75" height="18" rx="9" fill="#fff" stroke="#7B3FA0"/>
  <text x="807" y="125" text-anchor="middle" font-size="10" fill="#7B3FA0">live ▾  mute</text>

  <rect x="612" y="140" width="232" height="118" rx="6" fill="#fff" stroke="#E0C8EE"/>
  <rect x="612" y="140" width="6" height="118" fill="#E0A000"/>
  <text x="628" y="158" font-size="11" fill="#E0A000" font-weight="bold">MEDIUM · turn 12</text>
  <text x="628" y="176" font-size="12">Three closed questions in a row.</text>
  <text x="628" y="192" font-size="12">Her own account isn't in yet.</text>
  <text x="628" y="214" font-size="11" fill="#555">Try: "Tell me more about what</text>
  <text x="628" y="228" font-size="11" fill="#555">the tightness is like."</text>
  <text x="628" y="248" font-size="10" fill="#7B3FA0" text-decoration="underline">CC-GI-07  open before closed</text>

  <rect x="612" y="270" width="232" height="80" rx="6" fill="#fff" stroke="#E0C8EE"/>
  <rect x="612" y="270" width="6" height="80" fill="#6AA84F"/>
  <text x="628" y="288" font-size="11" fill="#6AA84F" font-weight="bold">LOW · turn 14</text>
  <text x="628" y="306" font-size="12">Good — exploring relieving</text>
  <text x="628" y="322" font-size="12">factors. That's a gate.</text>
  <text x="628" y="340" font-size="10" fill="#7B3FA0" text-decoration="underline">CC-GI-11  characterise symptom</text>

  <rect x="612" y="365" width="232" height="60" rx="6" fill="#F4F4F4" stroke="#ddd"/>
  <text x="628" y="384" font-size="11" fill="#777">HELD FOR DEBRIEF</text>
  <text x="628" y="402" font-size="12" fill="#777">1 item</text>

  <rect x="612" y="440" width="232" height="40" rx="6" fill="#fff" stroke="#7B3FA0" stroke-dasharray="4,3"/>
  <text x="728" y="465" text-anchor="middle" font-size="12" fill="#7B3FA0">Ask for a hint (logged)</text>

  <text x="450" y="548" text-anchor="middle" font-size="11" fill="#555">Mentor interventions never appear in the patient's speech; each links to its rubric item, which shows source and licence on hover.</text>
</svg>
